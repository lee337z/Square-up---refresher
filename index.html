<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skills Refreshers — Square Up</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --green:#00843D; --forest:#0F3D26; --amber:#F5A623; --bg:#F6F5F1; --surface:#FFFFFF;
  --ink:#1B1F1D; --steel:#6B7570; --line:#E3E0D6; --soft:#FAFAF7; --warn-bg:#FBF7EC;
  --warn-line:#EADFB8; --warn-ink:#7A6A3A; --warn-strong:#5A4A1E; --wrong:#8C3323;
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12160F; --surface:#1A1F18; --ink:#F0EFE8; --steel:#9AA396; --line:#2C332A;
    --soft:#202619; --warn-bg:#2A2416; --warn-line:#4A4028; --warn-ink:#D6C48E; --warn-strong:#EFDFAE;
  }
}
:root[data-theme="dark"]{
  --bg:#12160F; --surface:#1A1F18; --ink:#F0EFE8; --steel:#9AA396; --line:#2C332A;
  --soft:#202619; --warn-bg:#2A2416; --warn-line:#4A4028; --warn-ink:#D6C48E; --warn-strong:#EFDFAE;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;}
h1,h2,h3,h4{font-family:'Space Grotesk',system-ui,sans-serif;font-weight:700;line-height:1.12;}
.container{max-width:1060px;margin:0 auto;padding:0 20px;}
button{font-family:inherit;cursor:pointer;}
img{max-width:100%;}

/* NAV */
nav{background:var(--forest);padding:14px 0;position:sticky;top:0;z-index:20;}
nav .container{display:flex;justify-content:space-between;align-items:center;gap:12px;}
.logo{font-family:'Space Grotesk';font-weight:700;color:#fff;font-size:18px;cursor:pointer;}
.logo span{color:var(--amber);}
.nav-right{display:flex;align-items:center;gap:14px;}
.nav-back{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;font-size:12.5px;padding:6px 13px;border-radius:5px;}
.nav-back:hover{border-color:var(--amber);}
.nav-badgecount{font-size:12px;color:#CFE3D6;white-space:nowrap;}

/* SHARED */
.pill{font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:4px;display:inline-block;}
.pill-trade{background:var(--soft);color:var(--ink);border:1px solid var(--line);}
.pill-free{background:var(--green);color:#fff;}
.pill-done{background:var(--amber);color:#3A2E0A;}
.notice{display:flex;gap:11px;align-items:flex-start;background:var(--warn-bg);border:1px solid var(--warn-line);padding:13px 16px;border-radius:7px;}
.notice-ic{flex-shrink:0;width:25px;height:25px;background:var(--amber);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#3A2E0A;font-size:13px;}
.notice p{font-size:12.6px;color:var(--warn-ink);}
.notice b{display:block;color:var(--warn-strong);font-size:13.2px;margin-bottom:1px;}
.btn{border:none;padding:12px 22px;font-weight:600;font-size:14px;border-radius:6px;}
.btn-primary{background:var(--green);color:#fff;}
.btn-primary:hover{background:#006E33;}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line);}
.btn-amber{background:var(--amber);color:#3A2E0A;}

/* HUB */
.hero{background:var(--surface);border-bottom:1px solid var(--line);padding:42px 0 28px;}
.hero h1{font-size:clamp(27px,4.4vw,40px);max-width:600px;}
.hero .sub{color:var(--steel);font-size:15.5px;max-width:560px;margin-top:12px;}
.hero .notice{margin-top:20px;max-width:650px;}
.filters{display:flex;gap:7px;flex-wrap:wrap;margin-top:24px;}
.chip{background:var(--surface);border:1px solid var(--line);padding:7px 15px;font-size:13px;font-weight:500;border-radius:20px;color:var(--steel);}
.chip:hover{border-color:var(--green);color:var(--green);}
.chip[aria-pressed="true"]{background:var(--green);color:#fff;border-color:var(--green);}
.hub-body{padding:32px 0 70px;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;text-align:left;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s;width:100%;color:inherit;}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(15,61,38,.09);}
.card-top{display:flex;justify-content:space-between;gap:8px;margin-bottom:12px;}
.card h3{font-size:16.5px;margin-bottom:7px;}
.card p{font-size:13.2px;color:var(--steel);flex:1;margin-bottom:13px;}
.card-meta{display:flex;justify-content:space-between;align-items:center;font-size:11.8px;color:var(--steel);border-top:1px solid var(--line);padding-top:11px;gap:8px;}
.card-meta b{color:var(--ink);}
.mini{display:flex;align-items:center;gap:4px;font-size:11px;color:#B08A2E;font-weight:600;}
.mini::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--amber);}
.soon{border:2px dashed var(--line);border-radius:10px;padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--steel);}
.soon h3{font-size:14.5px;color:var(--steel);margin-bottom:5px;}
.soon p{font-size:12.4px;}

/* COURSE */
.c-hero{background:var(--surface);border-bottom:1px solid var(--line);padding:34px 0 28px;}
.c-hero h1{font-size:clamp(24px,3.6vw,34px);max-width:600px;margin-top:11px;}
.c-meta{display:flex;gap:18px;margin-top:13px;color:var(--steel);font-size:13.5px;flex-wrap:wrap;}
.c-meta b{color:var(--ink);}
.c-body{display:grid;grid-template-columns:1fr 250px;gap:34px;padding:32px 0 70px;align-items:start;}
.lesson{background:var(--surface);border:1px solid var(--line);border-radius:9px;margin-bottom:13px;overflow:hidden;}
.lesson-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;width:100%;background:none;border:none;text-align:left;color:inherit;gap:10px;}
.lesson-head:hover{background:var(--soft);}
.lesson-n{font-family:'Space Grotesk';color:var(--green);font-size:12.5px;font-weight:700;margin-bottom:2px;}
.lesson-t{font-size:15.8px;font-weight:600;}
.chev{color:var(--steel);transition:transform .2s;font-size:13px;flex-shrink:0;}
.lesson[data-open="true"] .chev{transform:rotate(180deg);}
.lesson-body{display:none;padding:0 20px 20px;font-size:14.2px;color:var(--ink);}
.lesson[data-open="true"] .lesson-body{display:block;}
.lesson-body p+p{margin-top:9px;}
.eg{background:var(--soft);border-left:3px solid var(--green);padding:13px 15px;margin-top:11px;font-size:13.4px;border-radius:0 5px 5px 0;}
.eg b{font-weight:600;}
code{background:var(--soft);border:1px solid var(--line);padding:1px 5px;border-radius:3px;font-size:12.8px;}
.side{position:sticky;top:76px;display:flex;flex-direction:column;gap:13px;}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:17px;}
.panel h4{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--steel);margin-bottom:9px;}
.bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden;}
.bar-fill{height:100%;background:var(--green);width:0;transition:width .4s ease;}
.bar-txt{font-size:12.2px;color:var(--steel);margin-top:7px;}

/* QUIZ */
.quiz{background:var(--forest);color:#fff;border-radius:10px;padding:22px;}
.quiz h3{font-size:18px;margin-bottom:4px;}
.quiz .lead{font-size:12.8px;color:#CFE3D6;margin-bottom:15px;}
.qcount{font-size:11.5px;color:var(--amber);font-weight:600;letter-spacing:.03em;margin-bottom:7px;}
.qtext{font-size:14px;font-weight:600;margin-bottom:11px;}
.opt{display:block;width:100%;text-align:left;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.2);color:#fff;padding:10px 13px;font-size:13.2px;margin-bottom:7px;border-radius:6px;transition:all .15s;}
.opt:hover:not(:disabled){border-color:var(--amber);}
.opt:disabled{cursor:default;}
.opt[data-state="correct"]{background:var(--green);border-color:var(--green);}
.opt[data-state="wrong"]{background:var(--wrong);border-color:var(--wrong);}
.fb{font-size:12.6px;margin-top:9px;color:#CFE3D6;min-height:17px;}
.quiz-foot{margin-top:13px;display:flex;gap:9px;}
.quiz-foot .btn{flex:1;padding:11px;font-size:13.5px;}
.result-big{font-family:'Space Grotesk';font-size:38px;font-weight:700;text-align:center;margin:6px 0 2px;}
.result-sub{text-align:center;font-size:13px;color:#CFE3D6;margin-bottom:15px;}
.cert{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:8px;padding:16px;text-align:center;}
.cert-badge{width:46px;height:46px;background:var(--amber);border-radius:50%;margin:0 auto 9px;display:flex;align-items:center;justify-content:center;font-size:21px;}
.cert h4{font-size:15px;color:var(--warn-strong);margin-bottom:4px;text-transform:none;letter-spacing:0;}
.cert p{font-size:11.8px;color:var(--warn-ink);}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}
@media(max-width:880px){.grid{grid-template-columns:repeat(2,1fr);}.c-body{grid-template-columns:1fr;}.side{position:static;}}
@media(max-width:560px){.grid{grid-template-columns:1fr;}}
</style>
</head>
<body>

<nav><div class="container">
  <button class="logo" id="homeBtn">SQUARE<span>UP</span></button>
  <div class="nav-right">
    <span class="nav-badgecount" id="badgeCount"></span>
    <button class="nav-back" id="backBtn" hidden>← All refreshers</button>
  </div>
</div></nav>

<main id="app"></main>

<script>
/* ============ COURSE DATA ============ */
const COURSES = [
  {
    id:"voltage-drop", trade:"Electrical", group:"Electrical", mins:20,
    title:"Voltage Drop & Cable Sizing Refresher",
    blurb:"The mV/A/m method, the 5% rule, and a worked example sizing cable for a 32A circuit.",
    lessons:[
      {t:"Why voltage drop matters on site", b:`<p>Undersized cable on long runs is one of the most common compliance fails inspectors find. Excess voltage drop means appliances underperform, motors run hot, and the circuit may fail compliance even though it appears to work fine on test day.</p><div class="eg"><b>Rule of thumb:</b> voltage drop should not exceed <code>5%</code> of nominal voltage for most final sub-circuits. Tighter limits apply to some installations — always confirm against the current AS/NZS 3008 tables.</div>`},
      {t:"The mV/A/m calculation method", b:`<p>Cable tables list a voltage drop figure in millivolts per amp per metre (mV/A/m). Multiply that figure by the circuit's current and the run length, then convert the result to a percentage of supply voltage.</p><div class="eg">Voltage drop (V) = (mV/A/m × Current × Length) ÷ 1000</div>`},
      {t:"Worked example: 32A circuit, 35m run", b:`<p>A 32A circuit runs 35m to a shed sub-board on 6mm² cable (approximately 7.3 mV/A/m).</p><div class="eg">Voltage drop = (7.3 × 32 × 35) ÷ 1000 = <b>8.18 V</b><br>As a % of 230 V supply: 8.18 ÷ 230 × 100 = <b>3.6%</b> — within the 5% limit.<br><br>If the run were 55 m instead, the drop rises to about <b>5.6%</b> — the cable size would need to increase.</div>`}
    ],
    bank:[
      {q:"A final sub-circuit calculates to 6.2% voltage drop. What should you do?",o:["Nothing — it's close enough","Increase cable size or shorten the run","Increase the circuit breaker rating","Reduce the supply voltage"],a:1,f:"Exceeding the 5% limit means the cable needs upsizing or the run shortened."},
      {q:"What does mV/A/m represent in cable tables?",o:["Maximum voltage per amp","Millivolts of drop per amp per metre","Minimum voltage across the metre","Metres of cable per amp"],a:1,f:"It's the voltage drop in millivolts, per amp of current, per metre of run."},
      {q:"In the formula, why divide by 1000?",o:["To convert amps to milliamps","To convert millivolts to volts","To allow for a safety factor","To convert metres to kilometres"],a:1,f:"The table figure is in millivolts, so dividing by 1000 gives volts."},
      {q:"Doubling the run length, with all else unchanged, does what to voltage drop?",o:["Halves it","Leaves it unchanged","Doubles it","Quadruples it"],a:2,f:"Voltage drop is directly proportional to length."},
      {q:"A 20A circuit runs 40m on cable rated 9.0 mV/A/m. What is the approximate drop?",o:["3.6 V","7.2 V","18 V","0.72 V"],a:1,f:"(9.0 × 20 × 40) ÷ 1000 = 7.2 V."},
      {q:"Which change would reduce voltage drop on an existing run?",o:["Fitting a larger cross-sectional cable","Fitting a higher-rated breaker","Adding more load to the circuit","Extending the run"],a:0,f:"A larger cross-sectional area lowers the mV/A/m figure, reducing drop."},
      {q:"Voltage drop of 8.05 V on a 230 V supply is what percentage?",o:["Around 1.8%","Around 3.5%","Around 5.9%","Around 8.0%"],a:1,f:"8.05 ÷ 230 × 100 ≈ 3.5%."},
      {q:"Which standard is the primary reference for cable selection and voltage drop figures in Australia?",o:["AS/NZS 3008","AS/NZS 5601","AS/NZS 3500","AS 1562"],a:0,f:"AS/NZS 3008 covers cable selection, including voltage drop data."},
      {q:"Excess voltage drop most directly causes which on-site symptom?",o:["Breakers tripping on overload","Appliances underperforming and motors running hot","Reversed polarity","Higher earth fault loop impedance only"],a:1,f:"Reduced voltage at the load means underperformance and heat in motors."},
      {q:"Which run is most at risk of excessive voltage drop?",o:["A 5m run at 10A","A 60m run at 32A","A 10m run at 16A","A 3m run at 40A"],a:1,f:"Both high current and long length increase drop — this run has both."}
    ]
  },
  {
    id:"pipe-sizing", trade:"Plumbing", group:"Plumbing", mins:20,
    title:"Pipe Sizing & Water Pressure Basics",
    blurb:"Calculating pipe diameter from flow rate and fixture units, plus pressure loss over length and elevation.",
    lessons:[
      {t:"Fixture units and peak demand", b:`<p>Pipe sizing starts with demand, not guesswork. Each fixture is assigned loading units, and the total for a branch converts to a probable simultaneous flow rate — fixtures are rarely all used at once, so the conversion is non-linear.</p><div class="eg"><b>Key point:</b> sizing to the sum of every fixture's maximum flow oversizes the pipe, wastes money, and can cause water to sit and stagnate in oversized mains.</div>`},
      {t:"Pressure loss: friction and elevation", b:`<p>Two things eat available pressure: friction through the pipe and fittings, and static lift where water has to rise.</p><div class="eg">Every <b>1 m</b> of vertical rise costs approximately <b>10 kPa</b> of pressure.<br><br>Friction loss increases with flow velocity and pipe length, and decreases with larger diameter.</div>`},
      {t:"Worked example: supply to a 3-bathroom home", b:`<p>A two-storey home with three bathrooms needs supply to the upper floor, 6m above the meter, with 320 kPa available at the meter.</p><div class="eg">Static loss for 6 m rise: 6 × 10 = <b>60 kPa</b><br>Remaining before friction: 320 − 60 = <b>260 kPa</b><br><br>Friction losses across the run and fittings must then leave enough residual pressure at the least favourable outlet. Undersize the pipe and velocity rises, friction climbs sharply, and the top-floor shower suffers when another outlet opens.</div>`}
    ],
    bank:[
      {q:"Approximately how much pressure is lost per metre of vertical rise?",o:["1 kPa","10 kPa","100 kPa","0.1 kPa"],a:1,f:"Roughly 10 kPa per metre of static lift."},
      {q:"Why is pipe not sized to the sum of all fixtures' maximum flows?",o:["Fixtures are rarely used simultaneously","Maximum flows are unknown","It would undersize the pipe","Regulations forbid it"],a:0,f:"Probable simultaneous demand is far lower than the theoretical maximum."},
      {q:"What happens to friction loss as pipe diameter increases, flow unchanged?",o:["It increases","It decreases","It stays the same","It becomes negative"],a:1,f:"Larger diameter lowers velocity and therefore friction loss."},
      {q:"A 4m rise from a 300 kPa supply leaves roughly what before friction losses?",o:["260 kPa","290 kPa","240 kPa","300 kPa"],a:0,f:"4 × 10 = 40 kPa lost, leaving about 260 kPa."},
      {q:"Which outlet should sizing calculations be checked against?",o:["The nearest outlet","The least favourable (highest/furthest) outlet","The largest-diameter outlet","Any outlet on the ground floor"],a:1,f:"If the least favourable outlet works, the rest will."},
      {q:"An oversized main can cause which problem?",o:["Excessive velocity","Water stagnation","Higher friction loss","Increased static pressure"],a:1,f:"Low velocity in oversized pipe allows water to sit and stagnate."},
      {q:"Which standard series primarily governs plumbing and drainage in Australia?",o:["AS/NZS 3000","AS/NZS 3500","AS/NZS 3008","AS 1562"],a:1,f:"AS/NZS 3500 covers plumbing and drainage."},
      {q:"Two main contributors to pressure loss in a supply run are:",o:["Friction and elevation","Temperature and colour","Pipe material and brand","Meter age and outlet count"],a:0,f:"Friction through pipe and fittings, plus static lift."},
      {q:"Higher flow velocity in a given pipe generally means:",o:["Lower friction loss","Higher friction loss","No change to friction","Lower noise"],a:1,f:"Friction loss rises sharply with velocity."},
      {q:"A top-floor shower drops off when a tap opens downstairs. Most likely cause?",o:["Pipe is oversized","Insufficient residual pressure / undersized supply","Excess static pressure","Too many fixture units unused"],a:1,f:"Undersized supply means friction losses spike when demand increases."}
    ]
  },
  {
    id:"span-tables", trade:"Carpentry", group:"Carpentry", mins:20,
    title:"Timber Sizing & Span Tables",
    blurb:"Reading span tables for joists and bearers, and sizing bearers for a standard deck frame.",
    lessons:[
      {t:"What a span table actually tells you", b:`<p>A span table gives the maximum distance a member can span for a given size, timber stress grade, spacing, and load condition. Change any one of those inputs and you're reading the wrong row.</p><div class="eg"><b>Common error:</b> reading a joist table for a bearer, or using a residential floor-load table for a deck carrying heavier or different loading.</div>`},
      {t:"Spacing, load width and stress grade", b:`<p>Joist spacing and the load width a bearer carries both change the answer. A bearer supporting joists spanning 3 m either side carries a 3 m load width, not 1.5 m.</p><div class="eg">Load width = half the joist span on one side + half on the other.<br><br>Stress grade (e.g. MGP10, F17) materially changes allowable span — never substitute a lower grade without re-checking.</div>`},
      {t:"Worked example: bearers for a 4m × 3m deck", b:`<p>A deck 4 m × 3 m has joists spanning 3 m at 450 mm centres, supported on two bearers.</p><div class="eg">Each bearer carries a load width of about <b>1.5 m</b> (half the 3 m joist span).<br>Bearer span between posts is set by post spacing — reducing post spacing shortens bearer span and allows a smaller bearer section.<br><br>Always confirm the final selection against the current span tables for the timber grade actually being supplied.</div>`}
    ],
    bank:[
      {q:"A span table's maximum span depends on all of these EXCEPT:",o:["Timber stress grade","Member spacing","Load condition","The colour of the finish"],a:3,f:"Grade, spacing and loading all matter; finish colour does not."},
      {q:"Load width for a bearer is calculated as:",o:["The full joist span","Half the joist span each side, added","The deck perimeter","Post spacing"],a:1,f:"Load width totals half the joist span from each side."},
      {q:"Reducing post spacing has what effect on required bearer size?",o:["Requires a larger bearer","Allows a smaller bearer","No effect","Doubles the span"],a:1,f:"Shorter bearer spans permit smaller sections."},
      {q:"Substituting a lower stress grade timber without rechecking spans is:",o:["Fine if the size is the same","Unsafe — allowable span changes with grade","Only an issue for bearers","Required by the tables"],a:1,f:"Stress grade directly changes allowable span."},
      {q:"Joists at 450mm centres versus 600mm centres will generally:",o:["Allow a longer span at 450","Allow a longer span at 600","Make no difference","Halve the load width"],a:0,f:"Closer spacing shares load between more members, allowing longer spans."},
      {q:"Which is a common span table error on site?",o:["Reading a joist table for a bearer","Checking the stress grade","Confirming spacing","Measuring the span"],a:0,f:"Joist and bearer tables are not interchangeable."},
      {q:"MGP10 and F17 are examples of:",o:["Fastener types","Timber stress grades","Span lengths","Load widths"],a:1,f:"They are stress grades affecting allowable span."},
      {q:"A bearer supporting joists that span 3m either side carries a load width of:",o:["1.5 m","3 m","6 m","0.75 m"],a:1,f:"Half of 3 m from each side = 3 m total load width."},
      {q:"If the supplied timber differs from what was specified, you should:",o:["Proceed as planned","Re-check spans against tables for the supplied grade","Reduce the span by 10%","Add more fixings"],a:1,f:"Re-check against the actual grade supplied."},
      {q:"Deck framing should be checked against tables for:",o:["Any residential floor load","The load condition matching the deck's actual use","Roof loading only","Whichever gives the longest span"],a:1,f:"Use the table matching the real load condition."}
    ]
  },
  {
    id:"paint-coverage", trade:"Painting", group:"Finishing", mins:15,
    title:"Coverage & Quantity Estimating",
    blurb:"Calculating litres needed from surface area and coverage rate, adjusted for texture and number of coats.",
    lessons:[
      {t:"Area first, then coverage rate", b:`<p>Every paint quote starts with net area: gross wall area minus openings. Then divide by the product's stated spread rate, and multiply by the number of coats.</p><div class="eg">Litres = (Net area ÷ spread rate m²/L) × number of coats</div>`},
      {t:"Why the tin's number is optimistic", b:`<p>Stated spread rates assume smooth, sealed, primed substrate and ideal application. Real surfaces rarely match.</p><div class="eg">Typical adjustments: rendered or textured surfaces can cut effective coverage by <b>20–30%</b>; bare or porous substrates soak up significantly more on the first coat.</div>`},
      {t:"Worked example: 3-bedroom exterior", b:`<p>Net exterior wall area of 210 m², product rated 14 m²/L, two coats, rendered (textured) finish.</p><div class="eg">Base: (210 ÷ 14) × 2 = <b>30 L</b><br>Texture adjustment at 25%: 30 × 1.25 = <b>37.5 L</b><br>Round up to available tin sizes, and allow extra for touch-ups.</div>`}
    ],
    bank:[
      {q:"Net area for a paint quote is:",o:["Gross area plus 10%","Gross area minus openings","Floor area","Perimeter × height × 2"],a:1,f:"Deduct windows and doors from gross wall area."},
      {q:"120 m² at 12 m²/L, two coats, requires approximately:",o:["10 L","20 L","24 L","5 L"],a:1,f:"(120 ÷ 12) × 2 = 20 L."},
      {q:"A textured render surface typically affects coverage how?",o:["Improves it by 20%","Reduces it by roughly 20–30%","No effect","Doubles it"],a:1,f:"Texture increases surface area, reducing effective coverage."},
      {q:"Stated spread rates on the tin assume:",o:["Worst-case porous substrate","Smooth, sealed, primed substrate","Textured render","Single coat over bare timber"],a:1,f:"They assume ideal, prepared conditions."},
      {q:"Bare, porous substrate on the first coat means:",o:["Less paint is used","More paint is absorbed","Coverage is unchanged","A third coat is unnecessary"],a:1,f:"Porous surfaces absorb significantly more on the first coat."},
      {q:"Which is missing from this calc: area ÷ spread rate = litres?",o:["Number of coats","Perimeter","Ceiling height","Tin size"],a:0,f:"Multiply by the number of coats."},
      {q:"After calculating litres you should:",o:["Round down to the nearest tin","Round up and allow for touch-ups","Order exactly the calculated figure","Halve it for the second coat"],a:1,f:"Round up to available tin sizes with touch-up allowance."},
      {q:"200 m² at 16 m²/L over two coats is:",o:["12.5 L","25 L","32 L","6.25 L"],a:1,f:"(200 ÷ 16) × 2 = 25 L."},

      {q:"Inclusions and exclusions should be:",o:["Stated in writing","Left vague","Decided on the day","Assumed"],a:0,f:"Written scope prevents disputes over what was covered."},
      {q:"Product and equipment cost should be:",o:["Absorbed","Included in the quote calculation","Billed separately later","Ignored"],a:1,f:"They are real costs of delivering the job."}
    ]
  },
  {
    id:"removals-volume", trade:"Removalists", group:"Other", mins:15,
    title:"Volume & Crew Time Estimating",
    blurb:"Estimating truck volume from home size and inventory, and calculating realistic crew hours.",
    lessons:[
      {t:"Estimating volume", b:`<p>Removal trucks are sized in cubic metres. Underestimating means a second trip; overestimating means paying for space you don't use.</p><div class="eg">Rough guide: a furnished bedroom contributes roughly 8–12 m³ of goods, though this varies hugely with how much the household owns.<br><br>Bulky, low-density items (mattresses, lounges, appliances) consume volume disproportionately to their weight.</div>`},
      {t:"Access is the hidden variable", b:`<p>Two identical loads can take very different times depending entirely on access at each end.</p><div class="eg">Time multipliers: stairs versus lift, long carry distance from truck to door, narrow driveways, parking restrictions, and booking a lift in an apartment building.<br><br>Always ask about access at <b>both</b> addresses before quoting.</div>`},
      {t:"Worked example: 3-bedroom local move", b:`<p>A furnished 3-bedroom home, ground floor, moving locally to a first-floor apartment with lift access.</p><div class="eg">1. Estimate volume from the room count and inventory.<br>2. Select truck size with headroom — a second trip costs far more than a slightly larger truck.<br>3. Estimate load time, travel time, and unload time separately.<br>4. Apply access multipliers for the first-floor destination and lift booking.<br>5. Multiply total hours by crew size and rate, and state clearly what is and isn't included (packing, materials, insurance).</div>`}
    ],
    bank:[
      {q:"Removal trucks are sized in:",o:["Cubic metres","Kilograms only","Square metres","Linear metres"],a:0,f:"Volume in m³ is the standard measure."},
      {q:"Which consumes volume disproportionately to weight?",o:["Boxes of books","Mattresses and lounges","Cutlery","Tools"],a:1,f:"Bulky low-density items eat volume."},
      {q:"The most commonly underestimated variable is:",o:["Truck colour","Access at both addresses","Fuel cost","Crew names"],a:1,f:"Stairs, carry distance and parking change times dramatically."},
      {q:"Underestimating volume typically results in:",o:["A cheaper job","A costly second trip","A faster move","Nothing"],a:1,f:"A second trip costs far more than extra truck capacity."},
      {q:"You should ask about access at:",o:["The pickup address only","The destination only","Both addresses","Neither"],a:2,f:"Both ends affect load and unload times."},
      {q:"Time should be estimated as:",o:["One lump figure","Load, travel and unload separately","Travel only","Per box"],a:1,f:"Separating the phases improves accuracy."},
      {q:"A furnished bedroom contributes roughly:",o:["1–2 m³","8–12 m³","30–40 m³","0.5 m³"],a:1,f:"Around 8–12 m³ as a rough guide."},
      {q:"Apartment moves often require:",o:["Nothing extra","A booked lift and allowance for carry distance","Smaller trucks always","Fewer crew"],a:1,f:"Lift booking and carry distance add real time."},
      {q:"Total cost is calculated from:",o:["Volume only","Total hours × crew size × rate, plus extras","Distance only","Box count"],a:1,f:"Crew hours drive the labour cost."},
      {q:"Packing, materials and insurance should be:",o:["Assumed included","Clearly stated as included or excluded","Never mentioned","Charged after the move"],a:1,f:"Ambiguity here causes disputes."}
    ]
  }

];
const GROUPS = [
  {k:"all", label:"All trades"},
  {k:"Electrical", label:"Electrical"},
  {k:"Plumbing", label:"Plumbing"},
  {k:"Carpentry", label:"Carpentry"},
  {k:"Outdoor", label:"Outdoor & Roofing"},
  {k:"Finishing", label:"Finishing & Fit-out"},
  {k:"Other", label:"Other trades"}
];
const QUIZ_LEN = 8, PASS = 0.8;

/* ============ STATE ============ */
let progress = {};          // {courseId:{lessons:[], best:0, passed:false, attempts:0}}
let route = {name:"hub", id:null};
let activeFilter = "all";
let quiz = null;

function blank(){ return {lessons:[], best:0, passed:false, attempts:0}; }
function prog(id){ if(!progress[id]) progress[id]=blank(); return progress[id]; }

function loadLocal(){
  try{ const raw = localStorage.getItem("su_refresher_progress");
    if(raw) progress = JSON.parse(raw) || {};
  }catch(e){ progress = {}; }
}
function saveLocal(){
  try{ localStorage.setItem("su_refresher_progress", JSON.stringify(progress)); }catch(e){}
}
function persist(){ saveLocal(); renderBadgeCount(); }

/* ============ HELPERS ============ */
function esc(s){ const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }
function shuffle(a){ const r=a.slice(); for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; } return r; }
function earned(){ return COURSES.filter(c=>prog(c.id).passed).length; }
function renderBadgeCount(){
  const n = earned();
  document.getElementById("badgeCount").textContent = n ? `${n} refresher badge${n>1?"s":""} earned` : "";
}

/* ============ HUB ============ */
function renderHub(){
  document.getElementById("backBtn").hidden = true;
  const chips = GROUPS.map(g=>
    `<button class="chip" data-f="${g.k}" aria-pressed="${activeFilter===g.k}">${esc(g.label)}</button>`).join("");

  const cards = COURSES.filter(c=>activeFilter==="all"||c.group===activeFilter).map(c=>{
    const p = prog(c.id);
    const done = p.passed;
    return `<button class="card" data-course="${c.id}">
      <div class="card-top">
        <span class="pill pill-trade">${esc(c.trade)}</span>
        <span class="pill ${done?"pill-done":"pill-free"}">${done?"Completed":"Free"}</span>
      </div>
      <h3>${esc(c.title)}</h3>
      <p>${esc(c.blurb)}</p>
      <div class="card-meta">
        <span><b>${c.mins} min</b> · ${c.lessons.length} lessons</span>
        <span class="mini">${done?`Badge earned · ${p.best}%`:"Refresher badge"}</span>
      </div>
    </button>`;
  }).join("");

  const soon = activeFilter==="all" ? `<div class="soon"><h3>30 more trades coming soon</h3><p>Gas, concreting, plastering, pest control &amp; more — same free, practical format.</p></div>` : "";

  document.getElementById("app").innerHTML = `
  <header class="hero"><div class="container">
    <h1>Free skills refreshers for tradies</h1>
    <p class="sub">Quick, practical calculation refreshers built for the job — not red tape. Pass one to add a Skills Refresher badge to your profile.</p>
    <div class="notice">
      <div class="notice-ic" aria-hidden="true">i</div>
      <p><b>Not accredited CPD.</b>These are free skills refreshers only — they don't count toward licence renewal or CPD requirements, and don't replace your trade qualification or licence conditions. Always refer to current AS/NZS standards and your state regulator.</p>
    </div>
    <div class="filters" id="filters">${chips}</div>
  </div></header>
  <section class="hub-body"><div class="container">
    <div class="grid">${cards}${soon}</div>
  </div></section>`;

  document.getElementById("filters").addEventListener("click", e=>{
    const b = e.target.closest(".chip"); if(!b) return;
    activeFilter = b.dataset.f; renderHub();
  });
  document.querySelectorAll("[data-course]").forEach(el=>{
    el.addEventListener("click", ()=>{ route={name:"course", id:el.dataset.course}; render(); window.scrollTo(0,0); });
  });
}

/* ============ COURSE ============ */
function renderCourse(){
  const c = COURSES.find(x=>x.id===route.id);
  if(!c){ route={name:"hub"}; return renderHub(); }
  document.getElementById("backBtn").hidden = false;
  const p = prog(c.id);

  const lessons = c.lessons.map((l,i)=>`
    <div class="lesson" data-open="${i===0}" data-i="${i}">
      <button class="lesson-head">
        <div><div class="lesson-n">LESSON ${i+1}</div><div class="lesson-t">${esc(l.t)}</div></div>
        <div class="chev" aria-hidden="true">▾</div>
      </button>
      <div class="lesson-body">${l.b}</div>
    </div>`).join("");

  document.getElementById("app").innerHTML = `
  <header class="c-hero"><div class="container">
    <div>
      <span class="pill pill-trade">${esc(c.trade)}</span>
      <span class="pill ${p.passed?"pill-done":"pill-free"}">${p.passed?"Completed":"Free for members"}</span>
    </div>
    <h1>${esc(c.title)}</h1>
    <div class="c-meta">
      <span><b>${c.mins} min</b> · self-paced</span>
      <span><b>${c.lessons.length} lessons</b> + quiz</span>
      <span><b>${QUIZ_LEN} questions</b> from a ${c.bank.length}-question bank · 80% pass, unlimited retakes</span>
    </div>
    <div class="notice" style="margin-top:18px;max-width:560px;">
      <div class="notice-ic" aria-hidden="true">i</div>
      <p><b>Skills Refresher — not a licence check</b>This is different from your "Verified" badge (ABN, licence &amp; insurance). Completing this shows you've refreshed a core calculation — it isn't CPD-accredited and doesn't replace your formal training or the current standards.</p>
    </div>
  </div></header>
  <section class="container c-body">
    <div>${lessons}</div>
    <aside class="side">
      <div class="panel">
        <h4>Your progress</h4>
        <div class="bar"><div class="bar-fill" id="barFill"></div></div>
        <div class="bar-txt" id="barTxt"></div>
      </div>
      <div id="quizMount"></div>
    </aside>
  </section>`;

  document.querySelectorAll(".lesson-head").forEach(h=>{
    h.addEventListener("click", ()=>{
      const el = h.parentElement, i = Number(el.dataset.i);
      const open = el.dataset.open === "true";
      el.dataset.open = open ? "false" : "true";
      if(!open){
        const pp = prog(c.id);
        if(!pp.lessons.includes(i)){ pp.lessons.push(i); persist(); updateBar(c); }
      }
    });
  });
  const pp = prog(c.id);
  if(!pp.lessons.includes(0)){ pp.lessons.push(0); persist(); }
  updateBar(c);
  mountQuizIntro(c);
}

function updateBar(c){
  const p = prog(c.id), total = c.lessons.length;
  const seen = p.lessons.filter(i=>i<total).length;
  const fill = document.getElementById("barFill");
  const txt = document.getElementById("barTxt");
  if(!fill) return;
  fill.style.width = Math.round((seen/total)*100) + "%";
  txt.textContent = `${seen} of ${total} lessons viewed` + (p.passed?` · quiz passed (${p.best}%)`:"");
}

/* ============ QUIZ ============ */
function mountQuizIntro(c){
  const p = prog(c.id);
  const mount = document.getElementById("quizMount");
  mount.innerHTML = `<div class="quiz">
    <h3>${p.passed?"Quiz passed":"Final quiz"}</h3>
    <p class="lead">${QUIZ_LEN} questions drawn at random from ${c.bank.length}. Pass mark 80%. Unlimited retakes.</p>
    ${p.attempts?`<p class="lead">Best score: <b style="color:var(--amber)">${p.best}%</b> · ${p.attempts} attempt${p.attempts>1?"s":""}</p>`:""}
    <button class="btn btn-amber" style="width:100%" id="startQuiz">${p.attempts?"Retake quiz":"Start quiz"}</button>
  </div>
  ${p.passed?certHTML(c):""}`;
  document.getElementById("startQuiz").addEventListener("click", ()=>startQuiz(c));
}

function certHTML(c){
  return `<div class="cert" style="margin-top:13px;">
    <div class="cert-badge" aria-hidden="true">✓</div>
    <h4>Skills Refresher Badge</h4>
    <p>${esc(c.title)}<br><br>Confirms completion of an informal skills refresher only. Not an accredited qualification, not a licence, and not CPD-recognised by any regulator.</p>
  </div>`;
}

function startQuiz(c){
  quiz = { course:c, qs: shuffle(c.bank).slice(0,Math.min(QUIZ_LEN,c.bank.length)), i:0, score:0, answered:false };
  renderQuestion();
}

function renderQuestion(){
  const {course,qs,i,score} = quiz;
  const q = qs[i];
  const opts = q.o.map((o,idx)=>`<button class="opt" data-idx="${idx}">${esc(o)}</button>`).join("");
  document.getElementById("quizMount").innerHTML = `<div class="quiz">
    <div class="qcount">QUESTION ${i+1} OF ${qs.length} · SCORE ${score}</div>
    <div class="qtext">${esc(q.q)}</div>
    <div id="opts">${opts}</div>
    <div class="fb" id="fb"></div>
    <div class="quiz-foot"><button class="btn btn-amber" id="nextQ" style="display:none">${i+1<qs.length?"Next question":"See result"}</button></div>
  </div>`;
  document.getElementById("opts").addEventListener("click", e=>{
    const b = e.target.closest(".opt"); if(!b || quiz.answered) return;
    quiz.answered = true;
    const chosen = Number(b.dataset.idx);
    const correct = chosen === q.a;
    if(correct) quiz.score++;
    document.querySelectorAll(".opt").forEach((o,idx)=>{
      o.disabled = true;
      if(idx===q.a) o.dataset.state="correct";
      else if(idx===chosen) o.dataset.state="wrong";
    });
    document.getElementById("fb").textContent = (correct?"Correct. ":"Not quite. ") + q.f;
    document.getElementById("nextQ").style.display = "block";
  });
  document.getElementById("nextQ").addEventListener("click", ()=>{
    if(quiz.i+1 < qs.length){ quiz.i++; quiz.answered=false; renderQuestion(); }
    else finishQuiz();
  });
}

function finishQuiz(){
  const c = quiz.course;
  const pct = Math.round((quiz.score/quiz.qs.length)*100);
  const passed = (quiz.score/quiz.qs.length) >= PASS;
  const p = prog(c.id);
  p.attempts++;
  if(pct > p.best) p.best = pct;
  if(passed) p.passed = true;
  persist(); updateBar(c);

  document.getElementById("quizMount").innerHTML = `<div class="quiz">
    <div class="result-big" style="color:${passed?"var(--amber)":"#fff"}">${pct}%</div>
    <div class="result-sub">${quiz.score} of ${quiz.qs.length} correct — ${passed?"passed":"not passed (80% needed)"}</div>
    <div class="quiz-foot">
      <button class="btn btn-amber" id="againQ">${passed?"Retake":"Try again"}</button>
      <button class="btn btn-ghost" style="color:#fff;border-color:rgba(255,255,255,.3)" id="doneQ">Back</button>
    </div>
  </div>
  ${passed?certHTML(c):""}`;
  document.getElementById("againQ").addEventListener("click", ()=>startQuiz(c));
  document.getElementById("doneQ").addEventListener("click", ()=>mountQuizIntro(c));
}

/* ============ ROUTER ============ */
function render(){ route.name==="course" ? renderCourse() : renderHub(); renderBadgeCount(); }
document.getElementById("homeBtn").addEventListener("click", ()=>{ route={name:"hub"}; render(); window.scrollTo(0,0); });
document.getElementById("backBtn").addEventListener("click", ()=>{ route={name:"hub"}; render(); window.scrollTo(0,0); });

loadLocal();
render();

/* Progress persists per browser via localStorage. */
</script>
</body>
</html>
